agent:
  module: omnirl.algorithms.ppo
modules:
  learner:
    gamma: 0.999
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.2
    lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 256
    max_chunks: 256
    store_log_probs: true
    track_version: true
  network:
    latent_dim: 256
    width_scale: 4
env:
  module: omnirl.envs.procgen
  id: procgen:procgen-bossfight-v0
  train_start_level: 0
  train_num_levels: 500
  test_start_level: 1000
  test_num_levels: 100
  evaluation_num_evaluators: 10
  distribution_mode: hard
  render_mode: null
  num_stack: 1
runner:
  ckpt_dir: results/bossfight/ppo-0
  eval_model: null
  num_learners: 4
  num_samplers: 100
  num_evaluators: 10
  max_updates: 3052
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 0
  sampler: 0
  evaluator: 0
